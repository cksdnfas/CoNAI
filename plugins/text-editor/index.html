<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문서 편집</title><link rel="stylesheet" href="conai-plugin.css"><link rel="stylesheet" href="style.css"><script type="module" src="main.js"></script></head>
<body><main>
  <div class="toolbar"><label for="files">문서</label><select id="files"></select><button id="refresh" type="button">최신 원본과 비교</button><button id="format" type="button">JSON 정렬</button><button id="revert" type="button">초안 버리기</button><button id="save" type="button" class="primary">저장 검토</button></div>
  <p id="status" role="status">연결 중…</p>
  <textarea id="editor" aria-label="문서 내용" spellcheck="false" disabled></textarea>
  <details id="comparison" hidden><summary>최신 저장 내용 · 초안은 위에서 계속 편집할 수 있어</summary><textarea id="latest" aria-label="최신 저장 내용" readonly spellcheck="false"></textarea></details>
</main></body></html>
